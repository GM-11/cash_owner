# Tests start the Spring context without a sequencer or a Kafka broker.
spring:
  grpc:
    server:
      port: 0
  kafka:
    listener:
      auto-startup: false
cash-owner:
  persistence:
    enabled: false
    data-dir: ./target/test-data
    snapshot-every: 10000
  kafka:
    engine-events-topic: engine.events.v1
    account-updates-topic: cash.account-updates.v1
  sequencer:
    enabled: false
    reconnect-min: 100ms
    reconnect-max: 5s
  owner:
    max-pending-requests: 10000
    check-invariants: true      # dev: on. Costs O(all orders) per job, so turn off under load tests / prod
    shutdown-drain: 5s
  dev-seed:
    accounts: []
